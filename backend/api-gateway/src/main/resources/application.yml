# ==============================================================================
# API Gateway — Default Profile (local development)
# ==============================================================================

server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          # Enable automatic route creation from Eureka service IDs
          enabled: true
          # Use lowercase service IDs in route predicates
          lower-case-service-id: true

      # ── Route definitions ──────────────────────────────────────────────
      routes:
        # Auth/User Service (Phase 2)
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    # Fetch registry frequently in dev for faster discovery
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
