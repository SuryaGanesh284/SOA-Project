# ==============================================================================
# API Gateway — Default Profile (local development)
# ==============================================================================

server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          # Enable automatic route creation from Eureka service IDs
          enabled: true
          # Use lowercase service IDs in route predicates
          lower-case-service-id: true

      # ── Route definitions ──────────────────────────────────────────────
      # Routes for business services will be added in later phases.
      # For Phase 1, the discovery locator handles dynamic routing.
      # Explicit routes with path rewriting and filters will be defined
      # per-service as they are implemented (Phase 2+).
      # ───────────────────────────────────────────────────────────────────

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    # Fetch registry frequently in dev for faster discovery
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
