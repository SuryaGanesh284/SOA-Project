server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

        - id: book-service
          uri: lb://book-service
          predicates:
            - Path=/api/v1/books/**, /api/v1/copies/**, /api/v1/digital-resources/**, /api/v1/admin/**

        - id: borrow-service
          uri: lb://borrow-service
          predicates:
            - Path=/api/v1/borrows/**

        - id: fine-service
          uri: lb://fine-service
          predicates:
            - Path=/api/v1/fines/**, /api/v1/payments/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

        - id: recommendation-service
          uri: lb://recommendation-service
          predicates:
            - Path=/api/v1/recommendations/**

        - id: discovery-service
          uri: lb://discovery-service
          predicates:
            - Path=/api/v1/discovery/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
